name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicitly target Linux amd64 (Debian 13 / AMD Ryzen 395+ target architecture)
env:
  GOOS: linux
  GOARCH: amd64

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check formatting (gofmt)
        run: |
          diffs=$(gofmt -s -d .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted properly:"
            echo "$diffs"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify module dependencies
        run: go mod verify

      - name: Build all packages
        run: go build -v ./...

      - name: Build binary
        run: go build -v -o globar ./cmd/main.go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Unit tests use simulated sysfs directories and mocked amd-smi calls,
      # allowing full test execution without requiring physical AMD Halo hardware.
      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
